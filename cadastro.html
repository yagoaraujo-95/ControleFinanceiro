<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="stylesheet" href="auth.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="login-page">

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4 shadow login-card">

        <h3 class="text-center mb-4">Cadastro</h3>

        <form id="cadastroForm">

            <!-- NOME -->
            <input 
                id="nome" 
                type="text" 
                class="form-control mb-2" 
                placeholder="Nome completo" 
                required
            >

            <!-- TELEFONE -->
            <!-- TELEFONE -->
            <input 
                id="telefone" 
                type="tel" 
                class="form-control mb-2" 
                placeholder="Telefone (DDD) - Ex: (11)9 9999-8888" 
                maxlength="20"
                required
            >

            <!-- CPF -->
            <input 
                id="cpf" 
                type="text" 
                class="form-control mb-2" 
                placeholder="CPF - Ex: 123.456.789-00" 
                maxlength="15"
                required
            >

            <!-- EMAIL -->
            <input 
                id="email" 
                type="email" 
                class="form-control mb-2" 
                placeholder="Email" 
                required
            >

            <!-- SENHA -->
            <input 
                id="senha" 
                type="password" 
                class="form-control mb-2" 
                placeholder="Senha segura" 
                minlength="6"
                required
            >

            <button class="btn btn-success w-100 mb-2">Cadastrar</button>

            <a href="login.html" class="btn btn-outline-secondary w-100">Voltar</a>

            <p id="erro" class="text-danger text-center mt-2"></p>

        </form>

    </div>

</div>

<script src="cadastro.js"></script>
</body>
</html>
